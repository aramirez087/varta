[package]
name = "varta-vlp-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
varta-vlp = { path = "../crates/varta-vlp", features = ["crypto"] }
varta-watch = { path = "../crates/varta-watch" }

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aead_roundtrip"
path = "fuzz_targets/aead_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_roundtrip"
path = "fuzz_targets/frame_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tracker_record"
path = "fuzz_targets/tracker_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_from_args"
path = "fuzz_targets/config_from_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kdf_derive"
path = "fuzz_targets/kdf_derive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "poly1305_mac"
path = "fuzz_targets/poly1305_mac.rs"
test = false
doc = false
bench = false
