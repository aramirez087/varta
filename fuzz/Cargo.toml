[package]
name = "varta-vlp-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
varta-vlp = { path = "../crates/varta-vlp", features = ["crypto"] }

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aead_roundtrip"
path = "fuzz_targets/aead_roundtrip.rs"
test = false
doc = false
bench = false
