[package]
name = "varta-vlp-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
varta-vlp = { path = "../crates/varta-vlp", features = ["crypto"] }
varta-watch = { path = "../crates/varta-watch", features = ["fuzzing"] }

