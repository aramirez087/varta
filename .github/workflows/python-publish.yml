name: publish-python-client

on:
  push:
    tags: ["python-v*"]

# Pinned to the `pypi` GitHub environment so the workflow inherits the
# Trusted Publisher binding configured at
# https://pypi.org/manage/project/varta/settings/publishing/.
permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    name: build & publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/varta/
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: build sdist + wheel
        working-directory: clients/python
        run: python -m build

      - name: publish to PyPI (OIDC, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist/
