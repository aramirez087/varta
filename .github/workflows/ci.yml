name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # `--all-features` cannot be used directly: `prometheus-exporter`
      # and `compile-time-config` are mutually exclusive (compile_error!
      # in `crates/varta-watch/src/lib.rs`).  Two explicit lanes cover
      # the SRE and Class-A profiles.
      - name: clippy (SRE — argv parser + HTTP exporter)
        run: |
          cargo clippy --workspace --all-targets \
            --features 'varta-watch/secure-udp varta-watch/unsafe-plaintext-udp varta-watch/unsafe-shell-recovery varta-watch/json-log varta-watch/audit-chain varta-watch/test-hooks varta-watch/prometheus-exporter varta-vlp/crypto varta-vlp/std varta-client/panic-handler varta-client/udp varta-client/secure-udp varta-client/test-hooks varta-tests/udp varta-tests/secure-udp varta-tests/shell-recovery varta-tests/test-hooks varta-tests/prometheus-exporter' \
            -- -D warnings

      - name: clippy (Class-A — compile-time config, no HTTP, no argv)
        env:
          VARTA_CONFIG_FILE: ${{ github.workspace }}/crates/varta-watch/tests/fixtures/safety_critical.varta.conf
        run: |
          cargo clippy -p varta-watch --all-targets \
            --no-default-features --features secure-udp,compile-time-config \
            -- -D warnings

      - name: clippy (no-default-features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: varta-vlp no_std build (default features)
        # Default-feature build of the protocol crate must compile as
        # `#![no_std]` for avionics targets (FreeRTOS, Zephyr) without libstd.
        run: cargo build -p varta-vlp --no-default-features

      - name: varta-vlp no_std build (crypto only)
        # `crypto` must stay no_std-clean — chacha20poly1305 / hkdf / sha2 /
        # zeroize are all `default-features = false`. This step trips if any
        # of them inadvertently re-enables `std` in a point release.
        run: cargo build -p varta-vlp --no-default-features --features crypto

      - name: install no_std target (thumbv7m-none-eabi)
        if: runner.os == 'Linux'
        run: rustup target add thumbv7m-none-eabi

      - name: varta-vlp builds for thumbv7m-none-eabi (no_std proof)
        # Cortex-M3 target — canonical bare-metal Rust target, matches the
        # FreeRTOS/Zephyr deployment exactly. `cargo build` (no link) is
        # sufficient for a library crate.
        if: runner.os == 'Linux'
        run: |
          cargo build -p varta-vlp --no-default-features --target thumbv7m-none-eabi
          cargo build -p varta-vlp --no-default-features --features crypto --target thumbv7m-none-eabi

      # `--all-features` is forbidden by the `prometheus-exporter` +
      # `compile-time-config` compile_error guard.  Run SRE-profile tests
      # with the full SRE feature set; Class-A coverage runs in a
      # dedicated safety-profiles step below.
      - name: tests (SRE profile, -D warnings)
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo test --workspace \
            --features 'varta-watch/secure-udp varta-watch/unsafe-plaintext-udp varta-watch/unsafe-shell-recovery varta-watch/json-log varta-watch/audit-chain varta-watch/test-hooks varta-watch/prometheus-exporter varta-vlp/crypto varta-vlp/std varta-client/panic-handler varta-client/udp varta-client/secure-udp varta-client/test-hooks varta-tests/udp varta-tests/secure-udp varta-tests/shell-recovery varta-tests/test-hooks varta-tests/prometheus-exporter'

      - name: doc-tests (SRE profile)
        run: |
          cargo test --doc --workspace \
            --features 'varta-watch/secure-udp varta-watch/unsafe-plaintext-udp varta-watch/unsafe-shell-recovery varta-watch/json-log varta-watch/audit-chain varta-watch/test-hooks varta-watch/prometheus-exporter varta-vlp/crypto varta-vlp/std varta-client/panic-handler varta-client/udp varta-client/secure-udp varta-client/test-hooks varta-tests/udp varta-tests/secure-udp varta-tests/shell-recovery varta-tests/test-hooks varta-tests/prometheus-exporter'

      - name: release build
        run: cargo build --workspace --release

      - name: examples build (SRE profile)
        run: |
          cargo build --workspace --examples \
            --features 'varta-watch/secure-udp varta-watch/unsafe-plaintext-udp varta-watch/unsafe-shell-recovery varta-watch/json-log varta-watch/audit-chain varta-watch/test-hooks varta-watch/prometheus-exporter varta-vlp/crypto varta-vlp/std varta-client/panic-handler varta-client/udp varta-client/secure-udp varta-client/test-hooks varta-tests/udp varta-tests/secure-udp varta-tests/shell-recovery varta-tests/test-hooks varta-tests/prometheus-exporter'

      - name: zero-dep audit (varta-vlp)
        run: |
          # varta-vlp: optional crypto deps are allowed under --features crypto;
          # non-optional deps remain forbidden.
          awk '/^\[dependencies\]$/{f=1;next} /^\[/{f=0} f && NF && !/^[[:space:]]*#/ && !/optional[[:space:]]*=[[:space:]]*true/{print "FAIL " FILENAME ": non-optional dep: " $0; exit 1}' crates/varta-vlp/Cargo.toml

      - name: crypto source audit (no hand-rolled primitives)
        run: |
          # Hand-rolled crypto in varta-vlp is forbidden. RustCrypto crates are
          # the only sanctioned source for ChaCha20, Poly1305, SHA-2, HKDF, and
          # related primitives. Historical hand-rolled files (poly1305.rs,
          # chacha20.rs) were deleted in the 2026-05-12 RustCrypto migration;
          # re-introducing them — even as a hand-rolled fallback — is a
          # regression.
          # See .wolf/cerebrum.md Do-Not-Repeat 2026-05-12.
          banned=$(find crates/varta-vlp/src/crypto -type f \
            \( -name 'poly1305.rs' \
            -o -name 'chacha20.rs' \
            -o -name 'salsa20.rs' \
            -o -name 'blake3.rs' \
            -o -name '*_handrolled*.rs' \) 2>/dev/null || true)
          if [ -n "$banned" ]; then
            echo "FAIL hand-rolled crypto file(s) detected:"
            echo "$banned"
            echo
            echo "Use the RustCrypto crates (chacha20poly1305, hkdf, sha2) instead."
            echo "See .wolf/cerebrum.md Do-Not-Repeat 2026-05-12."
            exit 1
          fi
          echo "OK no hand-rolled crypto in crates/varta-vlp/src/crypto/"

      - name: zero-dep audit (varta-client)
        run: |
          awk '/^\[dependencies\]$/{f=1;next} /^\[/{f=0} f && NF{print "FAIL " FILENAME ": " $0; exit 1}' crates/varta-client/Cargo.toml

      - name: zero-dep audit (varta-watch)
        run: |
          awk '/^\[dependencies\]$/{f=1;next} /^\[/{f=0} f && NF{print "FAIL " FILENAME ": " $0; exit 1}' crates/varta-watch/Cargo.toml

      - name: acceptance contract audit
        run: |
          set -e
          while IFS=$'\t' read -r name file kind; do
            case "$name" in \#*|"") continue ;; esac
            case "$kind" in
              test|no-harness)
                grep -qE "^[[:space:]]*fn[[:space:]]+${name}\b" "$file" \
                  || { echo "FAIL [$kind] $name @ $file"; exit 1; }
                ;;
              bench-assertion)
                grep -qF "$name" "$file" \
                  || { echo "FAIL [bench] $name @ $file"; exit 1; }
                ;;
            esac
            echo "OK [$kind] $name"
          done < tools/acceptance-contract.tsv

      - name: ignore audit
        run: |
          set -e
          # Find every #[ignore] in tests; each must have a // JUSTIFY: comment within ±2 lines.
          matches=$(git grep -nE '^[[:space:]]*#\[ignore' -- 'crates/**/tests/*.rs' || true)
          if [ -z "$matches" ]; then
            echo "OK no #[ignore] tests in tree"
            exit 0
          fi
          echo "$matches" | while IFS=: read -r f l _; do
            start=$((l-2)); [ "$start" -lt 1 ] && start=1
            end=$((l+2))
            if sed -n "${start},${end}p" "$f" | grep -q 'JUSTIFY:'; then
              echo "OK $f:$l #[ignore] (justified)"
            else
              echo "FAIL $f:$l #[ignore] without adjacent JUSTIFY"
              exit 1
            fi
          done

      - name: bench latency (record only — never fails CI)
        run: cargo run -p varta-bench --release -- latency || true

  fuzz-smoke:
    name: fuzz-smoke
    # Run on every PR and push — fuzzing is mandatory for safety-critical use.
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: rust toolchain (nightly — cargo-fuzz requires nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: fuzz frame_decode (30 s)
        run: cargo fuzz run frame_decode fuzz/corpus/frame_decode -- -max_total_time=30

      - name: fuzz frame_roundtrip (30 s)
        run: cargo fuzz run frame_roundtrip -- -max_total_time=30

      - name: fuzz aead_roundtrip (30 s)
        run: cargo fuzz run aead_roundtrip fuzz/corpus/aead_roundtrip -- -max_total_time=30

      - name: fuzz tracker_record (30 s)
        run: cargo fuzz run tracker_record -- -max_total_time=30

      - name: fuzz config_from_args (30 s)
        run: cargo fuzz run config_from_args -- -max_total_time=30

      - name: fuzz kdf_derive (30 s)
        run: cargo fuzz run kdf_derive -- -max_total_time=30

      - name: assert no fuzz artifacts (reproducer = CI failure)
        run: test -z "$(find fuzz/artifacts -type f 2>/dev/null)"

  miri:
    name: miri (unsafe-code interpretation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust toolchain (nightly + miri)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: cargo miri setup
        run: cargo miri setup
      - name: miri varta-vlp (pure no_std + crypto compute)
        run: cargo miri test -p varta-vlp --all-features
        env: { MIRIFLAGS: "-Zmiri-strict-provenance" }
      - name: miri varta-vlp crypto boundary tests
        run: cargo miri test -p varta-vlp --features crypto --test crypto_boundary
        env: { MIRIFLAGS: "-Zmiri-strict-provenance" }
      - name: miri peer_cred cmsg parsing
        run: cargo miri test -p varta-watch --lib peer_cred -- --test-threads=1
        env: { MIRIFLAGS: "-Zmiri-strict-provenance" }
      - name: miri tracker (pure-compute, no FFI)
        run: cargo miri test -p varta-watch --lib tracker -- --test-threads=1
        env: { MIRIFLAGS: "-Zmiri-strict-provenance" }
      - name: miri client classifier (pure-compute)
        run: cargo miri test -p varta-client --test classifier
        env: { MIRIFLAGS: "-Zmiri-strict-provenance" }

  safety-profiles:
    name: safety-profiles (production-safe binary audit)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: production-safe build (default features)
        run: cargo build -p varta-watch --release

      - name: verify no /bin/sh in production binary
        run: |
          strings target/release/varta-watch | grep -F "/bin/sh" \
            && { echo "FAIL: /bin/sh found in production-safe binary"; exit 1; } \
            || echo "OK: no /bin/sh in production-safe binary"

      - name: unsafe-shell-recovery feature compiles
        run: cargo build -p varta-watch --release --features unsafe-shell-recovery

      - name: unsafe-shell-recovery unit tests
        run: cargo test -p varta-watch --features unsafe-shell-recovery

      - name: unsafe-shell-recovery integration tests
        run: cargo test -p varta-tests --features shell-recovery

      - name: observer-liveness integration tests (L1 self-watchdog, L2 sd_notify, L3 hw_watchdog)
        run: cargo test -p varta-watch --features test-hooks --test notify --test cli_smoke --test self_watchdog

      # --- SRE profile (M3 — Prometheus HTTP exporter compiled in) ----------
      - name: SRE profile — build
        run: cargo build -p varta-watch --release --features prometheus-exporter

      - name: SRE profile — tests
        run: cargo test -p varta-watch --features prometheus-exporter

      # --- Class-A profile (M3 + M4 — no HTTP, no argv parser) --------------
      # Build with the canonical safety-critical recipe.  The CI fixture
      # (tests/fixtures/safety_critical.varta.conf) is the same one the
      # smoke test consumes locally.
      - name: Class-A profile — build
        env:
          VARTA_CONFIG_FILE: ${{ github.workspace }}/crates/varta-watch/tests/fixtures/safety_critical.varta.conf
        run: |
          cargo build -p varta-watch --release \
            --no-default-features --features secure-udp,compile-time-config

      - name: Class-A profile — strings audit
        run: |
          B=target/release/varta-watch
          FORBIDDEN=(
            "GET /metrics" "HTTP/1.0" "HTTP/1.1" "WWW-Authenticate"
            "Bearer realm" "/bin/sh"
            "--socket" "--threshold-ms" "--prom-addr" "--prom-token-file"
            "--recovery-cmd" "--recovery-exec" "--help" "--secure-key-file"
            "--master-key-file" "--key-file" "--clock-source" "--i-accept"
            "--allow-cross-namespace" "--udp-port"
            "--features audit-chain" "--features secure-udp"
            "--features unsafe-plaintext-udp" "--features unsafe-shell-recovery"
          )
          fail=0
          for needle in "${FORBIDDEN[@]}"; do
            if strings "$B" | grep -qF -- "$needle"; then
              echo "FAIL: Class-A binary contains forbidden literal: $needle"
              fail=1
            fi
          done
          if [ "$fail" -eq 0 ]; then
            echo "OK: Class-A strings audit clean"
          else
            exit 1
          fi

      - name: Class-A profile — smoke
        env:
          VARTA_CONFIG_FILE: ${{ github.workspace }}/crates/varta-watch/tests/fixtures/safety_critical.varta.conf
        run: |
          cargo test -p varta-watch --release \
            --no-default-features --features secure-udp,compile-time-config \
            --test compile_time_config_smoke --test strings_audit

      # --- Compile-error guard ---------------------------------------------
      # The combination `prometheus-exporter` + `compile-time-config` is
      # explicitly forbidden in lib.rs.  CI confirms the diagnostic fires.
      - name: Mutually-exclusive features fail to compile
        env:
          VARTA_CONFIG_FILE: ${{ github.workspace }}/crates/varta-watch/tests/fixtures/safety_critical.varta.conf
        run: |
          if cargo build -p varta-watch --release \
            --no-default-features --features prometheus-exporter,compile-time-config 2>&1 \
            | tee /tmp/feature-combo.log \
            | grep -qF "cannot be combined with"
          then
            echo "OK: prometheus-exporter + compile-time-config rejected by compile_error!"
          else
            echo "FAIL: combination should have triggered compile_error!"
            cat /tmp/feature-combo.log
            exit 1
          fi

  book:
    name: build-book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install mdbook
        run: |
          tag=$(curl -s https://api.github.com/repos/rust-lang/mdBook/releases/latest | grep -oP '"tag_name": "\K[^"]+')
          curl -L "https://github.com/rust-lang/mdBook/releases/download/${tag}/mdbook-${tag}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          mv mdbook /usr/local/bin/

      - name: build book
        run: mdbook build
