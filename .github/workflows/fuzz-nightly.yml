name: fuzz-nightly

# Long-form fuzzing: each declared target runs for 30 minutes per night.
# The 30-second `fuzz-smoke` job in `ci.yml` gates merges; this workflow
# accumulates coverage between runs via the corpus cache, surfaces deep
# convergence bugs that fall outside the smoke budget, and auto-opens an
# issue on any crash.

on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  long-form:
    name: fuzz-nightly (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      # The workspace rust-toolchain.toml pins stable, which would override
      # the nightly toolchain installed below and break -Zsanitizer=address.
      # Force nightly for all cargo/rustc invocations in this job.
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        target:
          - frame_decode
          - frame_roundtrip
          - aead_roundtrip
          - tracker_record
          - config_from_args
          - kdf_derive
          - peer_cred_cmsg
          - flag_catalogue_lookup
          - bounded_index_u32
          - bounded_index_ip
          - outstanding_table
          - ip_state_table

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: rust toolchain (nightly — cargo-fuzz requires nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: install cargo-fuzz
        # NOT `--locked`: cargo-fuzz's pinned Cargo.lock drags in a `rustix`
        # version that uses internal rustc attributes
        # (`rustc_layout_scalar_valid_range_start/end`) which break on current
        # nightly — every job died here, never reaching the fuzzer. Unpinned
        # resolution picks a `rustix` that builds on today's nightly.
        run: cargo install cargo-fuzz

      - name: restore corpus cache
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: ensure corpus directory exists
        run: mkdir -p fuzz/corpus/${{ matrix.target }}

      - name: fuzz ${{ matrix.target }} (30 min)
        # cargo-fuzz exits non-zero both for a real crash AND for infra
        # failures (build error, OOM, etc). Don't let the job's failure()
        # state alone drive issue creation — gate on a real reproducer
        # artifact instead (see "detect reproducer" below).
        run: cargo fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- -max_total_time=1800

      - name: detect reproducer
        # cargo-fuzz writes crash/leak/timeout/oom inputs into
        # fuzz/artifacts/<target>/. A genuine crash leaves at least one
        # file here; an infra failure (e.g. `cargo install cargo-fuzz`
        # or a build error) leaves the directory empty.
        id: repro
        if: always()
        run: |
          dir="fuzz/artifacts/${{ matrix.target }}"
          if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
            echo "crashed=true" >> "$GITHUB_OUTPUT"
          else
            echo "crashed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: upload artifacts (on real crash)
        if: steps.repro.outputs.crashed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

      - name: open or update issue (on real crash)
        if: steps.repro.outputs.crashed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const target = '${{ matrix.target }}';
            const runId = context.runId;
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${runId}`;
            // Stable title (no runId) so repeat crashes of the same target
            // dedup onto one issue instead of opening a fresh one per night.
            const title = `fuzz-nightly: ${target} crashed`;
            const body = `Nightly fuzz run produced a reproducer for **${target}**.\n\n` +
                  `* Latest run: ${runUrl}\n` +
                  `* Artifacts: download \`fuzz-artifacts-${target}\` from the run page.\n\n` +
                  `Reproduce locally:\n\n` +
                  "```\n" +
                  `cargo fuzz run ${target} fuzz/artifacts/${target}/<crash-input>\n` +
                  "```\n";
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: 'fuzz-crash', per_page: 100,
            });
            const hit = existing.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: hit.number,
                body: `Reproduced again in ${runUrl}.`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, labels: ['fuzz-crash', 'bug'], body,
              });
            }
