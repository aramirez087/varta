---
# Example Kubernetes deployment for varta-watch as a per-node sidecar
# observer. Pairs with the matching ServiceMonitor / PodMonitor manifest
# for kube-prometheus integration.
#
# This file is retained for non-Helm operators; the Helm chart at
# charts/varta-watch/ is the supported path. CI (`helm-parity`) asserts
# that the chart's default render matches this manifest field-for-field
# so the two paths cannot silently drift.
#
# Replace placeholders:
#   - image:        registry path for your built varta-watch image
#   - varta-token   Secret pre-populated with the bearer token
#
# This manifest assumes:
#   - one varta-watch per node (DaemonSet); switch to Deployment if you
#     instead run varta-watch alongside specific workloads
#   - agents share the UDS via a hostPath mount; switch to emptyDir if
#     all clients live in the same pod
#   - bearer token lives in a Secret named `varta-prom-token`
apiVersion: v1
kind: Namespace
metadata:
  name: varta
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Secret
metadata:
  name: varta-prom-token
  namespace: varta
type: Opaque
stringData:
  # Replace with the same value passed to --prom-token-file.
  # In production, source this from your secret manager (Vault, SOPS, ESO).
  token: REPLACE_ME_WITH_A_64_HEX_CHAR_TOKEN
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: varta-watch
  namespace: varta
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: varta-watch
  namespace: varta
  labels:
    app.kubernetes.io/name: varta-watch
    app.kubernetes.io/component: observer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: varta-watch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: varta-watch
        app.kubernetes.io/component: observer
      annotations:
        # Tell users of the legacy prometheus.io/* scrape annotations that
        # the ServiceMonitor / PodMonitor is preferred. These are kept for
        # operators on stock Prometheus.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: varta-watch
      hostPID: false
      hostNetwork: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: varta-watch
          image: ghcr.io/aramirez087/varta-watch:0.2.0
          imagePullPolicy: IfNotPresent
          args:
            - --uds-path=/run/varta/varta.sock
            - --prom-addr=0.0.0.0:9100
            - --prom-token-file=/etc/varta/prom.token
            - --self-watchdog-secs=4
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            # /metrics requires the bearer token; an unauthenticated probe
            # on the TCP port is the cheapest health check. A 401 reply
            # already proves the HTTP server is alive.
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: uds
              mountPath: /run/varta
            - name: token
              mountPath: /etc/varta
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uds
          # hostPath so agents on the node can reach the socket.
          # Switch to emptyDir if agents live in the same pod.
          hostPath:
            path: /run/varta
            type: DirectoryOrCreate
        - name: token
          secret:
            secretName: varta-prom-token
            items:
              - key: token
                path: prom.token
            defaultMode: 0o400
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: varta-watch
  namespace: varta
  labels:
    app.kubernetes.io/name: varta-watch
spec:
  type: ClusterIP
  clusterIP: None  # Headless; per-pod targets resolved by ServiceMonitor.
  selector:
    app.kubernetes.io/name: varta-watch
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
