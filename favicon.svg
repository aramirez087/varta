<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <path id="beat" d="M -10 32 L 16 32 L 24 44 L 36 12 L 44 38 L 50 32 L 74 32" />
  </defs>

  <!-- Thick cyan trace (always visible, highly contrasting) -->
  <use href="#beat" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Animated bright white pulse moving across the trace -->
  <use href="#beat" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="25 150">
    <animate attributeName="stroke-dashoffset" values="25; -150" dur="1.5s" repeatCount="indefinite" />
  </use>
</svg>
