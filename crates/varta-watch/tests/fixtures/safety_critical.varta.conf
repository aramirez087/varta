# Class-A safety-critical compile-time configuration fixture.
#
# Used by:
#   - CI safety-profiles job (builds the Class-A binary with this file)
#   - tests/compile_time_config_smoke.rs (asserts the binary refuses argv
#     and starts with this config baked in)
#   - build.rs grammar tests (parser fixture)
#
# See docs/architecture/compile-time-config.md for the canonical grammar.

# --- required ---------------------------------------------------------------
socket = /tmp/varta-classA-ci.sock
threshold_ms = 5000

# --- transport: UDS only, owner-only mode -----------------------------------
socket_mode = 0600
read_timeout_ms = 100

# --- tracker / observer -----------------------------------------------------
tracker_capacity = 256
tracker_eviction_policy = strict
eviction_scan_window = 256
clock_source = monotonic
signal_handler_mode = direct
iteration_budget_ms = 250
scrape_budget_ms = 250

# --- watchdogs / shutdown ---------------------------------------------------
shutdown_grace_ms = 5000

# --- safety acknowledgements (Class-A: ALL off by default) ------------------
i_accept_plaintext_udp = false
i_accept_recovery_on_secure_udp = false
i_accept_recovery_on_plaintext_udp = false
i_accept_secure_udp_non_loopback = false
allow_cross_namespace_agents = false
strict_namespace_check = true

# --- rate limiting defaults (tighter envelope for Class-A) ------------------
max_beat_rate = 50
global_beat_rate = 2000
global_beat_burst = 4000
uds_rcvbuf_bytes = 524288
