[package]
name = "varta-watch"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Varta observer — receives VLP frames and surfaces stalls."
authors = ["Alexander Ramirez"]
repository = "https://github.com/aramirez087/Varta"

[lints]
workspace = true

[dependencies]

[features]
default = []
# Enable UDP listener transport for network-based agents.
udp = []
# Enable secure UDP listener with ChaCha20-Poly1305 AEAD decryption.
# Implies `udp` and `varta-vlp/crypto`.
secure-udp = ["udp", "varta-vlp/crypto"]
# Emit structured JSON lines to stderr instead of plain eprintln!.
# Each line is a self-contained JSON object with ts_ns, level, msg,
# and optional context fields (pid, child_pid, error).  Suitable for
# SIEM / syslog ingestion in hospital IT environments.
json-log = []

[dependencies.varta-vlp]
path = "../varta-vlp"
version = "0.1.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "varta-watch"
path = "src/main.rs"
