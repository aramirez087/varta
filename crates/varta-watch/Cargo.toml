[package]
name = "varta-watch"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Varta observer — receives VLP frames and surfaces stalls."
authors = ["Alexander Ramirez"]
repository = "https://github.com/aramirez087/Varta"

[dependencies]

[features]
default = []
# Enable UDP listener transport for network-based agents.
udp = []

[dependencies.varta-vlp]
path = "../varta-vlp"
version = "0.1.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "varta-watch"
path = "src/main.rs"
