[package]
name = "varta-watch"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Varta observer — receives VLP frames and surfaces stalls."
authors = ["Alexander Ramirez"]
repository = "https://github.com/aramirez087/Varta"

[lints]
workspace = true

[dependencies]

[features]
default = []
# Internal: shared UDP socket wiring (UdpSocket bind/recv) used by both
# secure and plaintext UDP listeners.  Not user-facing on its own —
# enable `secure-udp` or `unsafe-plaintext-udp` instead.
udp-core = []
# Enable the AEAD-authenticated UDP listener (ChaCha20-Poly1305).  This
# is the recommended UDP transport — the only one with cryptographic
# sender authentication.
secure-udp = ["udp-core", "varta-vlp/crypto"]
# UNSAFE: enable the unauthenticated plaintext UDP listener.  Any device
# with network reach to the bound port can inject heartbeats, suppress
# stall detection, or trigger false recovery commands.  Even with this
# feature compiled in, the listener will refuse to bind at runtime
# unless `--i-accept-plaintext-udp` is passed.  Do not enable in
# production builds.
unsafe-plaintext-udp = ["udp-core"]
# Emit structured JSON lines to stderr instead of plain eprintln!.
# Each line is a self-contained JSON object with ts_ns, level, msg,
# and optional context fields (pid, child_pid, error).  Suitable for
# SIEM / syslog ingestion in hospital IT environments.
json-log = []

[dependencies.varta-vlp]
path = "../varta-vlp"
version = "0.1.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "varta-watch"
path = "src/main.rs"
