[package]
name = "varta-vlp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Varta Lifeline Protocol — 32-byte fixed-layout health frame."
authors = ["Alexander Ramirez"]
repository = "https://github.com/aramirez087/Varta"

[features]
default = []
# Opt-in std-dependent conveniences (currently: `Key::from_file`). Off by
# default so the crate is `#![no_std]` + alloc-free out of the box, ready
# for avionics targets (FreeRTOS, Zephyr) without a libstd port.
std = []
# Enables ChaCha20-Poly1305 AEAD for secure VLP transport.
# Pulls four externally-audited RustCrypto crates (NCC Group audit).
# These are the only registry deps in varta-vlp and are all optional.
# All four are `default-features = false` so this feature is no_std-clean.
crypto = ["dep:chacha20poly1305", "dep:hkdf", "dep:sha2", "dep:zeroize"]

[lints]
workspace = true

[dependencies]
# Optional: only present when --features crypto is active.
# Zero impact on the default UDS build — cargo tree shows no registry deps
# unless the feature is enabled.
chacha20poly1305 = { version = "0.10", default-features = false, optional = true }
hkdf             = { version = "0.12", default-features = false, optional = true }
sha2             = { version = "0.10", default-features = false, optional = true }
zeroize          = { version = "1.7",  default-features = false, optional = true, features = ["derive"] }
