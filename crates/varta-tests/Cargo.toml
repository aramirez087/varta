[package]
name = "varta-tests"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Varta end-to-end test harness — owned by Session 06."

[lints]
workspace = true

[dependencies]

[features]
# Test the plaintext UDP transport end-to-end.  The observer side requires
# `varta-watch/unsafe-plaintext-udp` (compiled-in plaintext path) and the
# binary must be invoked with `--i-accept-plaintext-udp` at runtime — both
# are deliberate opt-ins to reflect the production posture: plaintext UDP
# is unsafe and must be acknowledged at every layer.
udp = ["varta-client/udp", "varta-watch/unsafe-plaintext-udp"]
secure-udp = ["varta-client/secure-udp", "varta-watch/secure-udp"]
shell-recovery = ["varta-watch/unsafe-shell-recovery"]
# Forward test-hooks to varta-client (H6 counter-wrap fast-forward) and to
# varta-watch (existing self-watchdog wedge).
test-hooks = ["varta-client/test-hooks", "varta-watch/test-hooks"]
# Forward the Prometheus HTTP exporter feature so end_to_end tests that
# scrape /metrics can opt in.  Default `cargo test -p varta-tests` runs
# the SRE-profile lane (this feature off) — most contract tests are
# transport-level and do not need /metrics.
prometheus-exporter = ["varta-watch/prometheus-exporter"]

[dev-dependencies]
varta-vlp = { path = "../varta-vlp", features = ["crypto"] }
varta-client = { path = "../varta-client", features = ["panic-handler"] }
# `varta-tests` is an SRE-profile contract harness: it drives the binary
# via argv and asserts on the live `/metrics` endpoint, so it always
# requires `prometheus-exporter`.  Class-A safety-critical coverage
# (no argv, no HTTP) lives in `varta-watch/tests/compile_time_config_smoke.rs`.
varta-watch = { path = "../varta-watch", features = ["prometheus-exporter"] }
proptest = "1"

[[test]]
name = "end_to_end"
path = "tests/end_to_end.rs"
harness = false
