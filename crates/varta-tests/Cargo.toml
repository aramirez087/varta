[package]
name = "varta-tests"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Varta end-to-end test harness — owned by Session 06."

[dependencies]

[features]
udp = ["varta-client/udp", "varta-watch/udp"]

[dev-dependencies]
varta-vlp = { path = "../varta-vlp" }
varta-client = { path = "../varta-client", features = ["panic-handler"] }
varta-watch = { path = "../varta-watch" }

[[test]]
name = "end_to_end"
path = "tests/end_to_end.rs"
harness = false
