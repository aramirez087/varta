[package]
name = "varta-tests"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Varta end-to-end test harness — owned by Session 06."

[lints]
workspace = true

[dependencies]

[features]
# Test the plaintext UDP transport end-to-end.  The observer side requires
# `varta-watch/unsafe-plaintext-udp` (compiled-in plaintext path) and the
# binary must be invoked with `--i-accept-plaintext-udp` at runtime — both
# are deliberate opt-ins to reflect the production posture: plaintext UDP
# is unsafe and must be acknowledged at every layer.
udp = ["varta-client/udp", "varta-watch/unsafe-plaintext-udp"]
secure-udp = ["varta-client/secure-udp", "varta-watch/secure-udp"]

[dev-dependencies]
varta-vlp = { path = "../varta-vlp", features = ["crypto"] }
varta-client = { path = "../varta-client", features = ["panic-handler"] }
varta-watch = { path = "../varta-watch" }
proptest = "1"

[[test]]
name = "end_to_end"
path = "tests/end_to_end.rs"
harness = false
