[package]
name = "varta-client"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Varta agent API — emits VLP frames over a Unix Domain Socket."
authors = ["Alexander Ramirez"]
repository = "https://github.com/aramirez087/Varta"

[features]
default = []
panic-handler = []
# Enable UDP transport backend for network-based agents.
udp = []
# Enable secure UDP transport with ChaCha20-Poly1305 AEAD encryption.
# Implies `udp`, `varta-vlp/crypto`, and `varta-vlp/std` — the `secure_udp`
# example calls `Key::from_file`, which lives behind `varta-vlp/std` so the
# protocol crate stays `no_std` for embedded consumers.
secure-udp = ["udp", "varta-vlp/crypto", "varta-vlp/std"]

[lints]
workspace = true

[dependencies]

[dependencies.varta-vlp]
path = "../varta-vlp"
version = "0.1.0"

[[example]]
name = "basic"

[[example]]
name = "with_payload"

[[example]]
name = "with_panic_handler"
required-features = ["panic-handler"]

[[example]]
name = "udp"
required-features = ["udp"]

[[example]]
name = "secure_udp"
required-features = ["secure-udp"]
