[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/varta-vlp",
    "crates/varta-client",
    "crates/varta-watch",
    "crates/varta-tests",
    "crates/varta-bench",
]

# Every crate must explicitly opt out of unsafe_code with #![allow(unsafe_code)]
# where FFI or kernel interfaces require it.  This creates a grep-able audit
# trail: search for `allow(unsafe_code)` to find all permitted unsafe sites.
[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
overflow-checks = true
panic = "abort"
lto = "thin"
