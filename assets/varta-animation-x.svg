<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -75 600 450" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', monospace; }
      
      .grid {
        stroke: #ffffff;
        stroke-opacity: 0.03;
        stroke-width: 1;
      }
      
      .pulse-ring {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: center;
      }
      .pulse-ring:nth-child(2) {
        animation-delay: 1s;
      }
      
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(3); opacity: 0; }
      }

      .float {
        animation: floating 4s ease-in-out infinite;
      }

      @keyframes floating {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      
      .data-packet {
        fill: #00ffcc;
        filter: url(#glow);
      }
      
      .text-glow {
        text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
      }
      .text-glow-purple {
        text-shadow: 0 0 10px rgba(136, 0, 255, 0.5);
      }
    </style>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <radialGradient id="agentGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#004433"/>
    </radialGradient>

    <radialGradient id="observerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#8800ff"/>
      <stop offset="100%" stop-color="#220044"/>
    </radialGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00ffcc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8800ff" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <path id="ecgPath" d="M 150 150 L 260 150 L 275 100 L 300 220 L 325 120 L 340 150 L 450 150" fill="none" />
  </defs>

  <!-- Background -->
  <rect x="0" y="-75" width="600" height="450" fill="url(#bgGrad)" rx="8"/>

  <!-- Grid -->
  <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" class="grid"/>
  </pattern>
  <rect x="0" y="-75" width="600" height="450" fill="url(#gridPattern)"/>

  <!-- ECG Line Static Base -->
  <path d="M 150 150 L 260 150 L 275 100 L 300 220 L 325 120 L 340 150 L 450 150" stroke="#333" stroke-width="2" fill="none" />
  
  <!-- ECG Line Glowing -->
  <path d="M 150 150 L 260 150 L 275 100 L 300 220 L 325 120 L 340 150 L 450 150" stroke="url(#lineGrad)" stroke-width="3" fill="none" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0, 800; 800, 0" dur="2s" repeatCount="indefinite" />
  </path>

  <!-- Packets moving along path -->
  <g>
    <circle r="4" class="data-packet">
      <animateMotion dur="2s" repeatCount="indefinite">
        <mpath href="#ecgPath" />
      </animateMotion>
      <animate attributeName="r" values="3; 6; 3" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 1; 1; 0" dur="2s" keyTimes="0; 0.1; 0.9; 1" repeatCount="indefinite" />
    </circle>
    <circle r="4" class="data-packet">
      <animateMotion dur="2s" begin="1s" repeatCount="indefinite">
        <mpath href="#ecgPath" />
      </animateMotion>
      <animate attributeName="r" values="3; 6; 3" dur="2s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 1; 1; 0" dur="2s" begin="1s" keyTimes="0; 0.1; 0.9; 1" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Agent Node Area -->
  <g class="float" transform="translate(0, 0)">
    <!-- Pulse Rings -->
    <g transform="translate(150, 150)">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#00ffcc" stroke-width="2" class="pulse-ring"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#00ffcc" stroke-width="2" class="pulse-ring"/>
    </g>

    <circle cx="150" cy="150" r="25" fill="url(#agentGrad)" filter="url(#strongGlow)"/>
    <circle cx="150" cy="150" r="25" fill="url(#agentGrad)"/> <!-- Core to keep it sharp -->
    <text x="150" y="210" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="2" class="text-glow">AGENT</text>
    <text x="150" y="235" fill="#00ffcc" font-size="13" text-anchor="middle">varta_client::beat()</text>
    <text x="150" y="255" fill="#666666" font-size="11" text-anchor="middle">Zero allocation</text>
  </g>

  <!-- Observer Node Area -->
  <g class="float" style="animation-delay: -2s;" transform="translate(0, 0)">
    <!-- Rotating Dash Ring -->
    <g transform="translate(450, 150)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#8800ff" stroke-width="2" stroke-dasharray="10 10" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#8800ff" stroke-width="1" stroke-dasharray="4 20" opacity="0.4">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/>
      </circle>
    </g>

    <circle cx="450" cy="150" r="28" fill="url(#observerGrad)" filter="url(#strongGlow)"/>
    <circle cx="450" cy="150" r="28" fill="url(#observerGrad)"/> <!-- Core -->
    <text x="450" y="210" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="2" class="text-glow-purple">OBSERVER</text>
    <text x="450" y="235" fill="#8800ff" font-size="13" text-anchor="middle">varta-watch</text>
    <text x="450" y="255" fill="#666666" font-size="11" text-anchor="middle">Prometheus Export</text>
  </g>

  <!-- Central Info Box -->
  <g transform="translate(300, 70)">
    <rect x="-60" y="-15" width="120" height="30" rx="15" fill="#111111" stroke="#333333" stroke-width="1"/>
    <text x="0" y="4" fill="#00ffcc" font-size="12" font-weight="700" text-anchor="middle" class="text-glow">32-BYTE FRAME</text>
  </g>
  <text x="300" y="110" fill="#aaaaaa" font-size="11" text-anchor="middle" letter-spacing="1">Unix Domain Socket</text>
  <text x="300" y="125" fill="#555555" font-size="10" text-anchor="middle">Sub-microsecond path</text>
</svg>
