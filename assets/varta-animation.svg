<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      
      text {
        font-family: 'JetBrains Mono', monospace;
      }
      
      .node-title {
        font-weight: 700;
        font-size: 13px;
        fill: #f4f4f5;
        letter-spacing: 1.5px;
      }
      
      .node-sub {
        font-weight: 500;
        font-size: 11px;
        fill: #a1a1aa;
      }
      
      .node-desc {
        font-size: 9.5px;
        fill: #52525b;
      }
      
      .center-title {
        font-weight: 700;
        font-size: 11px;
        fill: #ff4757;
        letter-spacing: 1.5px;
      }
      
      .center-sub {
        font-size: 9px;
        fill: #52525b;
        letter-spacing: 1px;
      }
      
      .center-metric {
        font-size: 9px;
        fill: #52525b;
        letter-spacing: 1px;
      }

      /* Sonar pulse animation for Agent */
      @keyframes ping {
        0% {
          transform: scale(1);
          opacity: 0.8;
        }
        30% {
          opacity: 0.4;
        }
        100% {
          transform: scale(2.2);
          opacity: 0;
        }
      }
      
      .ping {
        animation: ping 1.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transform-origin: 180px 140px;
      }

      /* Slow rotation for Observer's dashed ring */
      @keyframes rotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      
      .rotate {
        animation: rotate 12s linear infinite;
        transform-origin: 620px 140px;
      }

      /* Observer status dot pulse on heartbeat arrival */
      @keyframes status-pulse {
        0%, 85% {
          fill: #10b981;
          filter: none;
          transform: scale(1);
        }
        93% {
          fill: #34d399;
          filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.6));
          transform: scale(1.25);
        }
        100% {
          fill: #10b981;
          filter: none;
          transform: scale(1);
        }
      }
      
      .observer-status {
        animation: status-pulse 1.8s ease-in-out infinite;
        transform-origin: 620px 140px;
      }
    </style>

    <!-- Subtle Grid Pattern matching Landing Page -->
    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />
    </pattern>

    <!-- Glow filter for the active pulse -->
    <filter id="pulse-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Solid Dark Background -->
  <rect width="100%" height="100%" fill="#09090b" rx="12" stroke="#27272a" stroke-width="1.5" />
  
  <!-- Subtle Grid Backdrop -->
  <rect width="100%" height="100%" fill="url(#gridPattern)" rx="12" pointer-events="none" />

  <!-- ==================== CENTRAL WIRE / PATH ==================== -->
  
  <!-- Background Static ECG Path (muted wire) -->
  <path d="M 180 140 L 370 140 L 385 90 L 400 190 L 415 110 L 430 140 L 620 140"
        fill="none" stroke="#27272a" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

  <!-- Animated Glowing Pulse Segment -->
  <path d="M 180 140 L 370 140 L 385 90 L 400 190 L 415 110 L 430 140 L 620 140"
        fill="none" stroke="#ff4757" stroke-width="2" stroke-linecap="round" filter="url(#pulse-glow)">
    <animate attributeName="stroke-dasharray" values="50 650" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="stroke-dashoffset" values="650; -50" dur="1.8s" repeatCount="indefinite" />
  </path>

  <!-- ==================== AGENT NODE (LEFT) ==================== -->
  <g id="agent-node">
    <!-- Sonar Ring -->
    <circle cx="180" cy="140" r="18" fill="none" stroke="#ff4757" stroke-width="1" class="ping" />
    
    <!-- Outer Border -->
    <circle cx="180" cy="140" r="12" fill="none" stroke="#27272a" stroke-width="1.5" />
    
    <!-- Core Dot -->
    <circle cx="180" cy="140" r="5" fill="#ff4757" />
    
    <!-- Text Labels -->
    <text x="180" y="185" text-anchor="middle" class="node-title">AGENT</text>
    <text x="180" y="202" text-anchor="middle" class="node-sub">varta-client</text>
    <text x="180" y="217" text-anchor="middle" class="node-desc">zero-allocation</text>
  </g>

  <!-- ==================== OBSERVER NODE (RIGHT) ==================== -->
  <g id="observer-node">
    <!-- Rotating Dashed Ring -->
    <circle cx="620" cy="140" r="18" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 4" class="rotate" />
    
    <!-- Outer Border -->
    <circle cx="620" cy="140" r="12" fill="none" stroke="#27272a" stroke-width="1.5" />
    
    <!-- Status Dot -->
    <circle cx="620" cy="140" r="5" class="observer-status" />
    
    <!-- Text Labels -->
    <text x="620" y="185" text-anchor="middle" class="node-title">OBSERVER</text>
    <text x="620" y="202" text-anchor="middle" class="node-sub">varta-watch</text>
    <text x="620" y="217" text-anchor="middle" class="node-desc">prom-exporter</text>
  </g>

  <!-- ==================== HUD METADATA (CENTER) ==================== -->
  
  <!-- Scoped Brackets for Title -->
  <path d="M 295 45 L 285 45 L 285 55" fill="none" stroke="#27272a" stroke-width="1" />
  <path d="M 285 70 L 285 80 L 295 80" fill="none" stroke="#27272a" stroke-width="1" />
  <path d="M 505 45 L 515 45 L 515 55" fill="none" stroke="#27272a" stroke-width="1" />
  <path d="M 515 70 L 515 80 L 505 80" fill="none" stroke="#27272a" stroke-width="1" />
  
  <!-- Centered HUD Labels -->
  <text x="400" y="58" text-anchor="middle" class="center-title">32-BYTE VLP FRAME</text>
  <text x="400" y="73" text-anchor="middle" class="center-sub">UNIX DOMAIN SOCKET / UDP</text>
  <text x="400" y="168" text-anchor="middle" class="center-metric">LATENCY &lt; 1μs</text>
</svg>
