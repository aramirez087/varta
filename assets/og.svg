<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1" />
    </pattern>
    <radialGradient id="glow" cx="32%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#ff4757" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ff4757" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#09090b" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Terminal-style frame brackets -->
  <path d="M 50 50 L 50 30 L 90 30" fill="none" stroke="#27272a" stroke-width="2" stroke-linecap="round" />
  <path d="M 1150 50 L 1150 30 L 1110 30" fill="none" stroke="#27272a" stroke-width="2" stroke-linecap="round" />
  <path d="M 50 580 L 50 600 L 90 600" fill="none" stroke="#27272a" stroke-width="2" stroke-linecap="round" />
  <path d="M 1150 580 L 1150 600 L 1110 600" fill="none" stroke="#27272a" stroke-width="2" stroke-linecap="round" />

  <!-- Wordmark -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">
    <text x="90" y="118" font-size="26" font-weight="700" fill="#52525b">&gt;</text>
    <text x="124" y="118" font-size="30" font-weight="800" fill="#f4f4f5" letter-spacing="4">VARTA</text>
    <circle cx="122" cy="102" r="4" fill="#ff4757" />
  </g>

  <!-- Headline (pain-first) -->
  <g font-family="'Plus Jakarta Sans', Helvetica, system-ui, sans-serif">
    <text x="88" y="206" font-size="46" font-weight="800" fill="#f4f4f5" letter-spacing="-1">Your background workers</text>
    <text x="88" y="262" font-size="46" font-weight="800" fill="#ff4757" letter-spacing="-1">die silently.</text>
    <!-- Sub -->
    <text x="90" y="312" font-size="24" font-weight="700" fill="#f4f4f5">Find out before your users do.</text>
    <text x="90" y="350" font-size="21" font-weight="500" fill="#a1a1aa">One observer watches thousands of local processes &#8212;</text>
    <text x="90" y="378" font-size="21" font-weight="500" fill="#a1a1aa">detects stalls, runs recovery, over a 32-byte beat.</text>
  </g>

  <!-- Chips -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">
    <g transform="translate(90, 430)">
      <rect width="120" height="36" rx="6" fill="none" stroke="#27272a" stroke-width="1.5" />
      <text x="60" y="23" text-anchor="middle" font-size="13" font-weight="600" fill="#10b981" letter-spacing="1">0 DEPS</text>
    </g>
    <g transform="translate(222, 430)">
      <rect width="130" height="36" rx="6" fill="none" stroke="#27272a" stroke-width="1.5" />
      <text x="65" y="23" text-anchor="middle" font-size="13" font-weight="600" fill="#ff4757" letter-spacing="1">P99 &lt; 1&#181;s</text>
    </g>
    <g transform="translate(364, 430)">
      <rect width="120" height="36" rx="6" fill="none" stroke="#27272a" stroke-width="1.5" />
      <text x="60" y="23" text-anchor="middle" font-size="13" font-weight="600" fill="#a1a1aa" letter-spacing="1">no_std</text>
    </g>
    <g transform="translate(496, 430)">
      <rect width="150" height="36" rx="6" fill="none" stroke="#27272a" stroke-width="1.5" />
      <text x="75" y="23" text-anchor="middle" font-size="13" font-weight="600" fill="#a1a1aa" letter-spacing="1">6 LANGUAGES</text>
    </g>
  </g>

  <!-- Terminal card: the stall -> recovery moment -->
  <g transform="translate(700, 150)">
    <rect width="448" height="330" rx="12" fill="#161618" stroke="#27272a" stroke-width="1.5" />
    <!-- title bar -->
    <rect width="448" height="40" rx="12" fill="#1f1f23" />
    <rect y="28" width="448" height="12" fill="#1f1f23" />
    <line x1="0" y1="40" x2="448" y2="40" stroke="#27272a" stroke-width="1" />
    <circle cx="22" cy="20" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="20" r="5.5" fill="#eab308" />
    <circle cx="62" cy="20" r="5.5" fill="#22c55e" />
    <text x="224" y="24" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" fill="#52525b">varta-watch</text>

    <!-- body -->
    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14.5">
      <text x="22" y="78"><tspan fill="#52525b">$ </tspan><tspan fill="#f4f4f5" font-weight="700">varta-watch</tspan><tspan fill="#ff2e43"> --threshold-ms</tspan><tspan fill="#a1a1aa"> 2000</tspan></text>
      <text x="22" y="110" fill="#52525b">&#8226; listening &#183; /metrics on :9100</text>
      <text x="22" y="146"><tspan fill="#10b981">&#8226;</tspan><tspan fill="#a1a1aa"> pid 4821 &#183; </tspan><tspan fill="#10b981" font-weight="700">Ok</tspan><tspan fill="#52525b"> &#183; 8ms ago</tspan></text>
      <text x="22" y="174"><tspan fill="#10b981">&#8226;</tspan><tspan fill="#a1a1aa"> pid 4821 &#183; </tspan><tspan fill="#10b981" font-weight="700">Ok</tspan><tspan fill="#52525b"> &#183; 11ms ago</tspan></text>
      <text x="22" y="210"><tspan fill="#f59e0b" font-weight="700">&#9888; pid 4821 &#183; STALL</tspan><tspan fill="#52525b"> &#183; silent 2104ms</tspan></text>
      <text x="22" y="244"><tspan fill="#ff4757" font-weight="700">&#8594; recovery:</tspan><tspan fill="#f4f4f5"> systemctl restart agent</tspan></text>
      <text x="22" y="272"><tspan fill="#10b981" font-weight="700">&#10003; recovered</tspan><tspan fill="#a1a1aa"> &#183; pid 4990 &#183; </tspan><tspan fill="#10b981" font-weight="700">Ok</tspan></text>
      <text x="22" y="306"><tspan fill="#52525b">varta_stalls_total </tspan><tspan fill="#f4f4f5">1</tspan></text>
    </g>
  </g>

  <!-- Footer -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="15" fill="#52525b">
    <text x="90" y="565" font-weight="600" fill="#a1a1aa">varta.sh</text>
    <text x="196" y="565" font-weight="500">&#183;  github.com/aramirez087/Varta  &#183;  MIT / Apache-2.0</text>
    <text x="1110" y="565" text-anchor="end" font-weight="700" fill="#ff4757">v0.2.0</text>
  </g>
</svg>
